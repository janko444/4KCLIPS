<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AE Web Editor Lite</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🎬 After Effects Web Lite</h1>

<input type="file" id="fileInput" accept="video/*">

<div class="layout">

  <video id="video" controls></video>

  <canvas id="canvas"></canvas>

</div>

<div class="panel">

  <label>Brightness</label>
  <input type="range" id="brightness" min="0.5" max="2" step="0.1" value="1">

  <label>Contrast</label>
  <input type="range" id="contrast" min="0.5" max="2" step="0.1" value="1">

  <label>Blur</label>
  <input type="range" id="blur" min="0" max="5" step="0.1" value="0">

  <label>Zoom</label>
  <input type="range" id="zoom" min="1" max="2" step="0.1" value="1">

</div>

<button id="export">Export Video</button>

<script src="script.js"></script>

</body>
</html>
